<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>네 컷 소설</title>
  <meta name="description" content="네 페이지로 읽는 짧은 소설 모음" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121211;
      --bg-card: #1c1b19;
      --paper: #f5f2eb;
      --paper-ink: #1b1a18;
      --text: #efece4;
      --text-muted: #969186;
      --border: rgba(239, 236, 228, 0.1);
      --serif: 'Gowun Batang', Georgia, serif;
      --sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    header {
      max-width: 1020px;
      width: 100%;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 2rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-family: var(--serif);
      font-size: 2rem;
      font-weight: 700;
      color: var(--paper);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .controls {
      max-width: 1020px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 0.5rem;
      display: flex;
      gap: 0.5rem;
    }

    .filter-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.4rem 0.95rem;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: var(--sans);
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--paper);
      color: var(--paper-ink);
      border-color: var(--paper);
      font-weight: 600;
    }

    main {
      max-width: 1020px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 1.5rem 4rem;
      flex: 1;
    }

    .novel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }

    .novel-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 210px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .novel-card:hover {
      transform: translateY(-3px);
      border-color: rgba(239, 236, 228, 0.28);
    }

    .card-genre {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      display: block;
    }

    .card-title {
      font-family: var(--serif);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--paper);
      margin-bottom: 0.75rem;
    }

    .card-hook {
      font-family: var(--serif);
      font-size: 0.95rem;
      color: #c2bdb2;
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-bottom {
      margin-top: 1.25rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Reader Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 8, 7, 0.85);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .reader-modal {
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      background: var(--paper);
      color: var(--paper-ink);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .reader-header {
      padding: 1rem 1.35rem;
      border-bottom: 1px solid rgba(27, 26, 24, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .reader-title {
      font-family: var(--serif);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .close-btn {
      background: none;
      border: none;
      color: #57534e;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
    }

    .card-viewport {
      padding: 1.75rem 1.6rem;
      overflow-y: auto;
      flex: 1;
    }

    .slide-ep-title {
      font-family: var(--serif);
      font-size: 1.05rem;
      font-weight: 700;
      color: #44403c;
      margin-bottom: 1.1rem;
    }

    .slide-body {
      font-family: var(--serif);
      font-size: 1.05rem;
      line-height: 1.9;
      color: #1b1a18;
      white-space: pre-line;
      word-break: keep-all;
    }

    .climax-img {
      width: 100%;
      margin-top: 1.6rem;
      border-radius: 8px;
      display: block;
    }

    .reader-nav {
      padding: 0.85rem 1.35rem;
      border-top: 1px solid rgba(27, 26, 24, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ede9df;
    }

    .nav-btn {
      background: #1b1a18;
      color: #f5f2eb;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--sans);
    }

    .nav-btn:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .page-dots {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(27, 26, 24, 0.22);
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .dot.active {
      background: #1b1a18;
      transform: scale(1.2);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      header {
        padding: 2.2rem 1.2rem 1.5rem;
      }
      .card-viewport {
        padding: 1.35rem 1.25rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>네 컷 소설</h1>
    <p>네 번의 페이지로 읽는 짧은 이야기</p>
  </header>

  <section class="controls" id="filterTabs">
    <button class="filter-btn active" data-category="all">전체</button>
    <button class="filter-btn" data-category="mystery">미스터리·스릴러</button>
    <button class="filter-btn" data-category="daily">일상·드라마</button>
  </section>

  <main>
    <div class="novel-grid" id="novelGrid"></div>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="reader-modal" role="dialog" aria-modal="true">
      <div class="reader-header">
        <h2 class="reader-title" id="modalTitle"></h2>
        <button class="close-btn" id="closeModalBtn" aria-label="닫기">✕</button>
      </div>

      <div class="card-viewport" id="cardViewport"></div>

      <div class="reader-nav">
        <button class="nav-btn" id="prevSlideBtn">이전</button>
        <div class="page-dots" id="pageDots"></div>
        <button class="nav-btn" id="nextSlideBtn">다음</button>
      </div>
    </div>
  </div>

  <footer>
    <p>
      © 2026 jeiel85 · <a href="https://creativecommons.org/licenses/by/4.0/deed.ko" target="_blank" rel="noopener">CC BY 4.0</a> · <a href="https://github.com/jeiel85/threads-short-novels" target="_blank" rel="noopener">GitHub</a>
    </p>
  </footer>

  <script>
    let allNovels = [];
    let currentFilter = 'all';
    let activeNovel = null;
    let currentSlideIdx = 0;

    const novelGrid = document.getElementById('novelGrid');
    const filterTabs = document.getElementById('filterTabs');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalTitle = document.getElementById('modalTitle');
    const cardViewport = document.getElementById('cardViewport');
    const pageDots = document.getElementById('pageDots');
    const prevSlideBtn = document.getElementById('prevSlideBtn');
    const nextSlideBtn = document.getElementById('nextSlideBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    async function loadNovels() {
      const res = await fetch('./novels.json?v=' + Date.now());
      allNovels = await res.json();
      renderGrid();
      const hash = window.location.hash.replace('#', '').trim();
      if (hash) openNovel(hash);
    }

    function renderGrid() {
      const filtered = currentFilter === 'all'
        ? allNovels
        : allNovels.filter(n => n.category === currentFilter);

      novelGrid.innerHTML = filtered.map(novel => `
        <article class="novel-card" data-slug="${novel.slug}">
          <div>
            <span class="card-genre">${novel.badge}</span>
            <h3 class="card-title">${novel.title}</h3>
            <p class="card-hook">${novel.hook}</p>
          </div>
          <div class="card-bottom">
            <span>총 ${novel.episodes.length}화</span>
            <span>읽기 →</span>
          </div>
        </article>
      `).join('');

      document.querySelectorAll('.novel-card').forEach(card => {
        card.addEventListener('click', () => openNovel(card.getAttribute('data-slug')));
      });
    }

    function openNovel(slug) {
      const found = allNovels.find(n => n.slug === slug);
      if (!found) return;
      activeNovel = found;
      currentSlideIdx = 0;
      history.replaceState(null, '', '#' + slug);

      modalTitle.textContent = activeNovel.title;
      modalBackdrop.classList.add('open');
      document.body.style.overflow = 'hidden';
      renderSlide();
    }

    function closeModal() {
      modalBackdrop.classList.remove('open');
      document.body.style.overflow = '';
      activeNovel = null;
      history.replaceState(null, '', window.location.pathname);
    }

    function renderSlide() {
      if (!activeNovel) return;
      const eps = activeNovel.episodes;
      const ep = eps[currentSlideIdx];
      const isLast = currentSlideIdx === eps.length - 1;

      cardViewport.innerHTML = `
        <div class="slide-ep-title">${ep.number}. ${escapeHtml(ep.title)}</div>
        <div class="slide-body">${escapeHtml(ep.body)}</div>
        ${isLast ? `<img class="climax-img" src="${activeNovel.climaxImage}" alt="${activeNovel.title}" />` : ''}
      `;
      cardViewport.scrollTop = 0;

      pageDots.innerHTML = eps.map((_, i) =>
        `<button class="dot ${i === currentSlideIdx ? 'active' : ''}" data-idx="${i}"></button>`
      ).join('');

      pageDots.querySelectorAll('.dot').forEach(dot => {
        dot.addEventListener('click', () => {
          currentSlideIdx = Number(dot.getAttribute('data-idx'));
          renderSlide();
        });
      });

      prevSlideBtn.disabled = currentSlideIdx === 0;
      nextSlideBtn.textContent = isLast ? '닫기' : '다음';
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    prevSlideBtn.addEventListener('click', () => {
      if (currentSlideIdx > 0) {
        currentSlideIdx--;
        renderSlide();
      }
    });

    nextSlideBtn.addEventListener('click', () => {
      if (!activeNovel) return;
      if (currentSlideIdx < activeNovel.episodes.length - 1) {
        currentSlideIdx++;
        renderSlide();
      } else {
        closeModal();
      }
    });

    closeModalBtn.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) closeModal();
    });

    window.addEventListener('keydown', (e) => {
      if (!activeNovel) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowRight' && currentSlideIdx < activeNovel.episodes.length - 1) {
        currentSlideIdx++;
        renderSlide();
      }
      if (e.key === 'ArrowLeft' && currentSlideIdx > 0) {
        currentSlideIdx--;
        renderSlide();
      }
    });

    filterTabs.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filterTabs.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-category');
        renderGrid();
      });
    });

    loadNovels();
  </script>
</body>
</html>
