<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>네 컷 소설관</title>
  <meta name="description" content="네 번의 페이지와 마지막 한 장의 컷신으로 읽는 짧은 이야기" />
  <meta name="theme-color" content="#111110" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="네 컷 소설관" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111110;
      --bg-elevated: #1a1917;
      --bg-card: #21201d;
      --paper: #f6f3ec;
      --paper-ink: #1b1a18;
      --paper-sub: #57534e;
      --text: #f3f0e8;
      --text-muted: #9e998e;
      --accent: #d97742;
      --accent-soft: rgba(217, 119, 66, 0.16);
      --border: rgba(243, 240, 232, 0.11);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      --serif: 'Gowun Batang', Georgia, serif;
      --sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Header / Hero */
    header.hero {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    h1.hero-title {
      font-family: var(--serif);
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--paper);
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .install-btn {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(217, 119, 66, 0.42);
      font-family: var(--sans);
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 0.38rem;
      padding: 0.42rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .install-btn.visible {
      display: inline-flex;
    }

    .install-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .pwa-toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #262420;
      color: var(--paper);
      border: 1px solid rgba(217, 119, 66, 0.45);
      box-shadow: var(--shadow);
      padding: 0.78rem 1.2rem;
      border-radius: 12px;
      font-size: 0.88rem;
      z-index: 2500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      max-width: calc(100vw - 2rem);
      text-align: center;
    }

    .pwa-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .repo-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .repo-link:hover {
      color: var(--text);
      border-color: rgba(243, 240, 232, 0.3);
      background: rgba(255, 255, 255, 0.04);
    }

    p.hero-desc {
      margin-top: 0.5rem;
      color: var(--text-muted);
      font-size: 0.98rem;
    }

    /* Filter Bar */
    .controls {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--bg-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.48rem 1rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--sans);
    }

    .filter-btn:hover {
      color: var(--text);
      border-color: rgba(243, 240, 232, 0.25);
    }

    .filter-btn.active {
      background: var(--paper);
      color: var(--paper-ink);
      border-color: var(--paper);
      font-weight: 600;
    }

    /* Novel Card Grid */
    main.container {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 1.5rem 4rem;
      flex: 1;
    }

    .novel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      gap: 1.5rem;
    }

    .novel-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.24s ease, border-color 0.24s ease, box-shadow 0.24s ease;
      position: relative;
    }

    .novel-card:hover {
      transform: translateY(-4px);
      border-color: rgba(217, 119, 66, 0.5);
      box-shadow: var(--shadow);
    }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #141312;
      overflow: hidden;
    }

    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .novel-card:hover .card-thumb {
      transform: scale(1.04);
    }

    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(17,17,16,0.05) 0%, rgba(17,17,16,0.0) 60%, rgba(33,32,29,0.55) 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem 1.15rem;
    }

    .thumb-top-badges {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .genre-badge {
      background: rgba(17, 17, 16, 0.78);
      backdrop-filter: blur(6px);
      color: #f3f0e8;
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
    }

    .card-body {
      padding: 1.25rem 1.35rem 1.4rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--paper);
      margin-bottom: 0.6rem;
    }

    .card-hook {
      font-family: var(--serif);
      font-size: 0.95rem;
      color: #c7c2b8;
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
      margin-bottom: 1.2rem;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .read-cta {
      color: #f29b6b;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* Modal Reader (Card News Style) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 8, 7, 0.86);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .reader-modal {
      width: 100%;
      max-width: 640px;
      max-height: 92vh;
      background: var(--bg-elevated);
      border: 1px solid rgba(243, 240, 232, 0.16);
      border-radius: 20px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .reader-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .reader-title-wrap {
      min-width: 0;
    }

    .reader-genre {
      font-size: 0.74rem;
      color: #f29b6b;
      font-weight: 600;
      display: block;
    }

    .reader-title {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--paper);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reader-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    .mode-toggle-btn, .close-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: var(--sans);
      transition: background 0.15s ease;
    }

    .mode-toggle-btn:hover, .close-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Step Indicator Pills */
    .step-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.4rem;
      padding: 0.75rem 1.25rem;
      background: #141311;
      border-bottom: 1px solid var(--border);
    }

    .step-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.42rem 0.3rem;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .step-pill.active {
      background: var(--paper);
      color: var(--paper-ink);
      border-color: var(--paper);
    }

    .step-pill.completed {
      border-color: rgba(217, 119, 66, 0.45);
      color: #e6c6b3;
    }

    /* Card News Page Viewport */
    .card-viewport {
      padding: 1.5rem 1.5rem;
      overflow-y: auto;
      flex: 1;
      background: var(--paper);
      color: var(--paper-ink);
    }

    .slide-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid rgba(27, 26, 24, 0.12);
    }

    .slide-ep-title {
      font-family: var(--serif);
      font-size: 1.12rem;
      font-weight: 700;
      color: #1b1a18;
    }

    .slide-body {
      font-family: var(--serif);
      font-size: 1.06rem;
      line-height: 1.88;
      color: #1f1e1b;
      white-space: pre-line;
      word-break: keep-all;
    }

    /* Climax Cutscene Box at the end of Episode 4 */
    .climax-cutscene-box {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(27, 26, 24, 0.14);
    }

    .climax-img {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(0, 0, 0, 0.18);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      display: block;
    }

    /* Bottom Navigation of Modal */
    .reader-nav {
      padding: 0.9rem 1.25rem;
      background: #141311;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .nav-btn {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.55rem 1.1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--sans);
      transition: all 0.15s ease;
    }

    .nav-btn:hover:not(:disabled) {
      border-color: rgba(243, 240, 232, 0.35);
      background: #2b2925;
    }

    .nav-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .nav-btn.primary:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .page-counter {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* All-in-one / Threads Copy View */
    .all-episodes-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .threads-copy-card {
      background: #fffdf9;
      border: 1px solid rgba(27, 26, 24, 0.15);
      border-radius: 12px;
      padding: 1.1rem;
    }

    .threads-copy-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.65rem;
      font-family: var(--sans);
      font-size: 0.82rem;
      color: #57534e;
    }

    .copy-ep-btn {
      background: #1b1a18;
      color: #f6f3ec;
      border: none;
      padding: 0.32rem 0.7rem;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    .copy-ep-btn:hover {
      background: var(--accent);
    }

    /* Footer */
    footer.site-footer {
      border-top: 1px solid var(--border);
      padding: 2.2rem 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.84rem;
    }

    footer.site-footer a {
      color: #d6d1c7;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (max-width: 600px) {
      header.hero {
        padding: 2rem 1rem 1.25rem;
      }
      .hero-title {
        font-size: 1.7rem;
      }
      .controls {
        padding: 1rem 1rem 0.25rem;
      }
      .filter-tabs {
        gap: 0.4rem;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 0.35rem;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .filter-tabs::-webkit-scrollbar {
        display: none;
      }
      .filter-btn {
        flex-shrink: 0;
        font-size: 0.82rem;
        padding: 0.42rem 0.85rem;
      }
      main.container {
        padding: 1rem 1rem 3rem;
      }
      .modal-backdrop {
        padding: 0;
      }
      .reader-modal {
        width: 100%;
        max-width: 100%;
        height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
        border: none;
      }
      .reader-header {
        padding: 0.85rem 1rem;
        padding-top: max(0.85rem, env(safe-area-inset-top));
      }
      .step-bar {
        padding: 0.6rem 1rem;
        gap: 0.35rem;
      }
      .step-pill {
        padding: 0.4rem 0.2rem;
        font-size: 0.74rem;
      }
      .card-viewport {
        padding: 1.25rem 1rem;
      }
      .slide-body {
        font-size: 1.02rem;
        line-height: 1.82;
      }
      .reader-nav {
        padding: 0.85rem 1rem;
        padding-bottom: max(0.85rem, env(safe-area-inset-bottom));
      }
      .pwa-toast {
        bottom: max(1rem, calc(env(safe-area-inset-bottom) + 0.5rem));
      }
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="hero-top">
      <h1 class="hero-title">네 컷 소설관</h1>
      <div class="hero-actions">
        <button class="install-btn" id="installAppBtn" type="button" aria-label="앱으로 설치">
          📲 앱 설치
        </button>
        <a class="repo-link" href="https://github.com/jeiel85/threads-short-novels" target="_blank" rel="noopener">
          GitHub ↗
        </a>
      </div>
    </div>
    <p class="hero-desc">네 번의 페이지와 마지막 한 장의 컷신으로 읽는 짧은 이야기</p>
  </header>

  <div class="pwa-toast" id="pwaToast" role="status" aria-live="polite"></div>

  <section class="controls">
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-btn active" data-category="all">전체</button>
      <button class="filter-btn" data-category="mystery">추리·미스터리·스릴러</button>
      <button class="filter-btn" data-category="daily">일상·드라마·로맨스</button>
    </div>
  </section>

  <main class="container">
    <div class="novel-grid" id="novelGrid"></div>
  </main>

  <!-- Card News Modal Viewer -->
  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="reader-modal" role="dialog" aria-modal="true">
      <div class="reader-header">
        <div class="reader-title-wrap">
          <span class="reader-genre" id="modalGenre"></span>
          <h2 class="reader-title" id="modalTitle"></h2>
        </div>
        <div class="reader-actions">
          <button class="mode-toggle-btn" id="modeToggleBtn">전체보기</button>
          <button class="close-btn" id="closeModalBtn">닫기 ✕</button>
        </div>
      </div>

      <div class="step-bar" id="stepBar"></div>

      <div class="card-viewport" id="cardViewport"></div>

      <div class="reader-nav" id="readerNav">
        <button class="nav-btn" id="prevSlideBtn">← 이전</button>
        <span class="page-counter" id="pageCounter">1 / 4</span>
        <button class="nav-btn primary" id="nextSlideBtn">다음 →</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>
      © 2026 <strong>jeiel85</strong> ·
      <a href="https://creativecommons.org/licenses/by/4.0/deed.ko" target="_blank" rel="noopener">
        CC BY 4.0 (저작자 표시)
      </a>
    </p>
  </footer>

  <script>
    let allNovels = [];
    let currentFilter = 'all';
    let activeNovel = null;
    let currentSlideIdx = 0;
    let isAllViewMode = false;

    const novelGrid = document.getElementById('novelGrid');
    const filterTabs = document.getElementById('filterTabs');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalGenre = document.getElementById('modalGenre');
    const modalTitle = document.getElementById('modalTitle');
    const stepBar = document.getElementById('stepBar');
    const cardViewport = document.getElementById('cardViewport');
    const readerNav = document.getElementById('readerNav');
    const prevSlideBtn = document.getElementById('prevSlideBtn');
    const nextSlideBtn = document.getElementById('nextSlideBtn');
    const pageCounter = document.getElementById('pageCounter');
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    async function loadNovels() {
      try {
        const res = await fetch('./novels.json?v=' + Date.now());
        allNovels = await res.json();
        renderGrid();
        checkUrlHash();
      } catch (err) {
        novelGrid.innerHTML = `<p style="color:var(--text-muted)">작품 목록을 불러오는 중 오류가 발생했습니다.</p>`;
      }
    }

    function renderGrid() {
      const filtered = currentFilter === 'all'
        ? allNovels
        : allNovels.filter(n => n.category === currentFilter);

      novelGrid.innerHTML = filtered.map(novel => `
        <article class="novel-card" data-slug="${novel.slug}">
          <div class="card-thumb-wrap">
            <img class="card-thumb" src="${novel.climaxImage}" alt="${novel.title}" loading="lazy" />
            <div class="thumb-overlay">
              <div class="thumb-top-badges">
                <span class="genre-badge">${novel.badge}</span>
              </div>
            </div>
          </div>
          <div class="card-body">
            <h3 class="card-title">${novel.title}</h3>
            <p class="card-hook">“${novel.hook}”</p>
            <div class="card-footer">
              <span>전 ${novel.episodes.length}화</span>
              <span class="read-cta">읽기 →</span>
            </div>
          </div>
        </article>
      `).join('');

      document.querySelectorAll('.novel-card').forEach(card => {
        card.addEventListener('click', () => {
          const slug = card.getAttribute('data-slug');
          openNovel(slug);
        });
      });
    }

    function openNovel(slug) {
      const found = allNovels.find(n => n.slug === slug);
      if (!found) return;
      activeNovel = found;
      currentSlideIdx = 0;
      isAllViewMode = false;
      history.replaceState(null, '', '#' + slug);

      modalGenre.textContent = activeNovel.genre;
      modalTitle.textContent = activeNovel.title;
      modalBackdrop.classList.add('open');
      document.body.style.overflow = 'hidden';
      renderModalContent();
    }

    function closeModal() {
      modalBackdrop.classList.remove('open');
      document.body.style.overflow = '';
      activeNovel = null;
      history.replaceState(null, '', window.location.pathname);
    }

    function renderModalContent() {
      if (!activeNovel) return;
      const eps = activeNovel.episodes;

      if (isAllViewMode) {
        modeToggleBtn.textContent = '페이지 뷰';
        stepBar.style.display = 'none';
        readerNav.style.display = 'none';

        cardViewport.innerHTML = `
          <div class="all-episodes-list">
            ${eps.map((ep, idx) => `
              <div class="threads-copy-card">
                <div class="threads-copy-head">
                  <span><strong>${ep.number}화</strong></span>
                  <button class="copy-ep-btn" data-idx="${idx}">본문 복사</button>
                </div>
                <div class="slide-body">${escapeHtml(ep.rawCopy)}</div>
              </div>
            `).join('')}
            <div class="climax-cutscene-box">
              <img class="climax-img" src="${activeNovel.climaxImage}" alt="${activeNovel.title}" />
            </div>
          </div>
        `;

        cardViewport.querySelectorAll('.copy-ep-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const idx = Number(btn.getAttribute('data-idx'));
            await navigator.clipboard.writeText(eps[idx].rawCopy);
            const orig = btn.textContent;
            btn.textContent = '복사됨';
            setTimeout(() => { btn.textContent = orig; }, 1400);
          });
        });
        cardViewport.scrollTop = 0;
        return;
      }

      modeToggleBtn.textContent = '전체보기';
      stepBar.style.display = 'grid';
      readerNav.style.display = 'flex';

      stepBar.innerHTML = eps.map((ep, idx) => {
        const cls = idx === currentSlideIdx ? 'active' : (idx < currentSlideIdx ? 'completed' : '');
        return `<button class="step-pill ${cls}" data-idx="${idx}">${ep.number}화</button>`;
      }).join('');

      stepBar.querySelectorAll('.step-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          currentSlideIdx = Number(pill.getAttribute('data-idx'));
          renderModalContent();
        });
      });

      const ep = eps[currentSlideIdx];
      const isLast = currentSlideIdx === eps.length - 1;

      cardViewport.innerHTML = `
        <div class="slide-meta">
          <h3 class="slide-ep-title">[${ep.number}화] ${escapeHtml(ep.title)}</h3>
        </div>
        <div class="slide-body">${escapeHtml(ep.body)}</div>
        ${isLast ? `
          <div class="climax-cutscene-box">
            <img class="climax-img" src="${activeNovel.climaxImage}" alt="${activeNovel.title}" />
          </div>
        ` : ''}
      `;

      cardViewport.scrollTop = 0;
      prevSlideBtn.disabled = currentSlideIdx === 0;
      pageCounter.textContent = `${currentSlideIdx + 1} / ${eps.length}`;

      if (isLast) {
        nextSlideBtn.textContent = '닫기 ✓';
      } else {
        nextSlideBtn.textContent = `다음 (${currentSlideIdx + 2}화) →`;
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    prevSlideBtn.addEventListener('click', () => {
      if (currentSlideIdx > 0) {
        currentSlideIdx--;
        renderModalContent();
      }
    });

    nextSlideBtn.addEventListener('click', () => {
      if (!activeNovel) return;
      if (currentSlideIdx < activeNovel.episodes.length - 1) {
        currentSlideIdx++;
        renderModalContent();
      } else {
        closeModal();
      }
    });

    // Mobile Touch Swipe Gesture Support
    let touchStartX = 0;
    let touchStartY = 0;

    cardViewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    cardViewport.addEventListener('touchend', (e) => {
      if (isAllViewMode || !activeNovel) return;
      if (e.changedTouches.length === 1) {
        const diffX = e.changedTouches[0].clientX - touchStartX;
        const diffY = e.changedTouches[0].clientY - touchStartY;
        // Check if horizontal swipe is prominent
        if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
          if (diffX < 0 && currentSlideIdx < activeNovel.episodes.length - 1) {
            // Swipe Left -> Next
            currentSlideIdx++;
            renderModalContent();
          } else if (diffX > 0 && currentSlideIdx > 0) {
            // Swipe Right -> Prev
            currentSlideIdx--;
            renderModalContent();
          }
        }
      }
    }, { passive: true });

    modeToggleBtn.addEventListener('click', () => {
      isAllViewMode = !isAllViewMode;
      renderModalContent();
    });

    closeModalBtn.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) closeModal();
    });

    window.addEventListener('keydown', (e) => {
      if (!activeNovel) return;
      if (e.key === 'Escape') closeModal();
      if (!isAllViewMode && e.key === 'ArrowRight' && currentSlideIdx < activeNovel.episodes.length - 1) {
        currentSlideIdx++;
        renderModalContent();
      }
      if (!isAllViewMode && e.key === 'ArrowLeft' && currentSlideIdx > 0) {
        currentSlideIdx--;
        renderModalContent();
      }
    });

    filterTabs.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filterTabs.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-category');
        renderGrid();
      });
    });

    function checkUrlHash() {
      const hash = window.location.hash.replace('#', '').trim();
      if (hash) {
        openNovel(hash);
      }
    }

    // PWA Service Worker & Install Prompt
    let deferredInstallPrompt = null;
    const installAppBtn = document.getElementById('installAppBtn');
    const pwaToast = document.getElementById('pwaToast');

    function showPwaToast(msg) {
      pwaToast.textContent = msg;
      pwaToast.classList.add('show');
      setTimeout(() => pwaToast.classList.remove('show'), 4200);
    }

    const isStandalone =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    const isIos = /iphone|ipad|ipod/i.test(window.navigator.userAgent);

    if (!isStandalone && isIos) {
      installAppBtn.classList.add('visible');
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      if (!isStandalone) {
        installAppBtn.classList.add('visible');
      }
    });

    installAppBtn.addEventListener('click', async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        const { outcome } = await deferredInstallPrompt.userChoice;
        if (outcome === 'accepted') {
          installAppBtn.classList.remove('visible');
        }
        deferredInstallPrompt = null;
      } else if (isIos) {
        showPwaToast('Safari 하단 공유 버튼(↑)을 누른 뒤 "홈 화면에 추가"를 선택해 설치하세요.');
      }
    });

    window.addEventListener('appinstalled', () => {
      installAppBtn.classList.remove('visible');
      deferredInstallPrompt = null;
      showPwaToast('네 컷 소설관이 홈 화면에 설치되었습니다!');
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    loadNovels();
  </script>
</body>
</html>
